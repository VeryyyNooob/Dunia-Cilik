plugins {
    id 'com.android.application'
}

android {
    namespace 'com.duniacilik.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.duniacilik.app'
        minSdk 23
        targetSdk 34
        versionCode 5
        versionName '1.0.4'

        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            applicationIdSuffix ''
            versionNameSuffix '-dev'
        }

        release {
            minifyEnabled false
        }
    }
}
